[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-relay"
version = "0.5.0"
description = "Provider-neutral delegation runtime and cost-aware multi-agent configuration for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "CortexRelay contributors" }
]
keywords = ["codex", "gemini", "antigravity", "mcp", "a2a", "multi-agent", "subagents", "orchestration", "model-routing", "reasoning-routing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
a2a = [
  "a2a-sdk[fastapi]>=1,<2",
  "uvicorn>=0.35",
]
runtime = [
  "mcp>=2,<3",
  "a2a-sdk[fastapi]>=1,<2",
  "uvicorn>=0.35",
]

[project.urls]
Homepage = "https://github.com/esaesa/cortex-relay"
Repository = "https://github.com/esaesa/cortex-relay"
Issues = "https://github.com/esaesa/cortex-relay/issues"

[project.scripts]
cortex-relay = "cortex_relay.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
