name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install CortexRelay
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test CLI
        run: cortex-relay --help

  a2a-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install A2A runtime
        run: python -m pip install -e ".[a2a]"

      - name: Run A2A tests
        run: python -m unittest tests.test_a2a tests.test_process -v

      - name: Smoke-test A2A imports
        run: python -c "from cortex_relay.transports.a2a import A2AServerPolicy, create_a2a_app; create_a2a_app(policy=A2AServerPolicy())"
