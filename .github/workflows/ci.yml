name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install CortexRelay
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test CLI
        run: cortex-relay --help

  a2a-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install A2A runtime
        run: python -m pip install -e ".[a2a]"

      - name: Run A2A in-process and loopback integration tests
        run: python -m unittest tests.test_a2a tests.test_process tests.integration.test_a2a_transport -v

      - name: Smoke-test A2A imports
        run: python -c "from cortex_relay.transports.a2a import A2AServerPolicy, create_a2a_app; create_a2a_app(policy=A2AServerPolicy())"

  state-concurrency-windows:
    runs-on: windows-latest

    env:
      CORTEX_RELAY_ARTIFACT_DIR: ${{ github.workspace }}/.ci-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CortexRelay
        run: python -m pip install -e .

      - name: Stress durable state without faults
        run: python tests/stress/state_concurrency.py --profile windows

      - name: Stress durable state under transient faults
        run: python tests/stress/state_concurrency.py --profile windows --fault-rate 0.02 --fault-point mixed

      - name: Stress durable state under exhausted faults
        run: python tests/stress/state_concurrency.py --profile fast --iterations 5 --fault-rate 1.0 --fault-point before_publish

      - name: Upload stress reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-concurrency-reports
          path: .ci-artifacts/
          if-no-files-found: ignore
